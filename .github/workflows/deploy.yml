name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: todo-lambda
  LAMBDA_FUNCTION: todo-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - run: |
          docker build --platform linux/amd64 --provenance=false --sbom=false -t $ECR_REPOSITORY .
          docker tag $ECR_REPOSITORY:latest ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:latest
          docker push ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:latest

      - run: |
          aws lambda update-function-code \
            --function-name $LAMBDA_FUNCTION \
            --image-uri ${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:latest \
            --region $AWS_REGION
